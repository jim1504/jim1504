      <stop offset="1" stop-color="#1D2B66"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#F3F5FA" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="380" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="22" fill="url(#grain)"/>
